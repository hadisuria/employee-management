<header class="navbar">
  <div class="navbar-inner">
    <div class="navbar-left">
      <a class="brand" routerLink="/employees" (click)="closeMenu()">
        <span class="brand-badge" aria-hidden="true">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </span>
        <span class="brand-name">Employee Management</span>
      </a>

      @if (!viewport.isMobile()) {
        <nav class="nav-links" aria-label="Main navigation">
          <a routerLink="/employees" routerLinkActive="is-active" class="nav-link"> Employees </a>
        </nav>
      }
    </div>

    @if (viewport.isMobile()) {
      <button
        type="button"
        class="menu-toggle"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        } @else {
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        }
      </button>
    } @else {
      <div class="navbar-right">
        <div class="user-chip">
          <span class="user-avatar" aria-hidden="true">{{ userInitial() }}</span>
          <span class="user-name">{{ authState.username() }}</span>
        </div>

        <button type="button" class="btn btn-ghost logout-btn" (click)="logout()">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Logout</span>
        </button>
      </div>
    }
  </div>

  @if (viewport.isMobile() && menuOpen()) {
    <div class="mobile-drawer">
      <a
        routerLink="/employees"
        routerLinkActive="is-active"
        class="mobile-nav-link"
        (click)="closeMenu()"
      >
        Employees
      </a>

      <div class="mobile-drawer-footer">
        <div class="user-chip">
          <span class="user-avatar" aria-hidden="true">{{ userInitial() }}</span>
          <span class="user-name">{{ authState.username() }}</span>
        </div>

        <button type="button" class="btn btn-outline logout-mobile" (click)="logout()">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  }
</header>
