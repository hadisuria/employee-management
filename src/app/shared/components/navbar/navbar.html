<div class="brand-accent-bar" aria-hidden="true"></div>
<mat-toolbar class="app-toolbar">
  <div class="toolbar-inner">
    <div class="toolbar-left">
      <a class="brand" routerLink="/employees">
        <span class="brand-mark" aria-hidden="true">
          <mat-icon>groups</mat-icon>
        </span>
        <span class="brand-name">Employee Management</span>
      </a>

      @if (!viewport.isMobile()) {
        <nav class="nav-links" aria-label="Main navigation">
          <a routerLink="/employees" routerLinkActive="is-active" class="nav-link">Employees</a>
        </nav>
      }
    </div>

    <div class="toolbar-right">
      <button
        matIconButton
        type="button"
        class="theme-toggle-btn"
        [class.is-dark]="theme.isDark()"
        [matTooltip]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="theme.toggle($event)"
      >
        <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      @if (viewport.isMobile()) {
        <button
          matIconButton
          type="button"
          [matMenuTriggerFor]="mobileMenu"
          aria-label="Open navigation menu"
        >
          <mat-icon>menu</mat-icon>
        </button>

        <mat-menu #mobileMenu="matMenu">
          <div class="menu-user">
            <span class="user-avatar" aria-hidden="true">{{ userInitial() }}</span>
            <span>{{ authState.username() }}</span>
          </div>
          <mat-divider />
          <a mat-menu-item routerLink="/employees">
            <mat-icon>badge</mat-icon>
            <span>Employees</span>
          </a>
          <button mat-menu-item type="button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      } @else {
        <div class="user-chip">
          <span class="user-avatar" aria-hidden="true">{{ userInitial() }}</span>
          <span>{{ authState.username() }}</span>
        </div>

        <button matButton type="button" class="logout-btn" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Logout
        </button>
      }
    </div>
  </div>
</mat-toolbar>
