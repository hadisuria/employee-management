<mat-form-field class="full-width" [subscriptSizing]="subscriptSizing()">
  <mat-label>{{ label() }}</mat-label>
  <mat-select
    panelClass="searchable-select-panel"
    [value]="selectedValue()"
    [required]="required()"
    [disabled]="isDisabled()"
    [placeholder]="placeholder()"
    [errorStateMatcher]="errorStateMatcher"
    (selectionChange)="onSelectChange($event.value)"
    (openedChange)="onOpenedChange($event)"
  >
    <mat-select-trigger>
      {{ selectedValue() || (allowClear() ? clearLabel() : placeholder()) }}
    </mat-select-trigger>

    <div class="select-search-box" (click)="$event.stopPropagation()">
      <mat-icon class="search-icon" aria-hidden="true">search</mat-icon>
      <input
        #searchInput
        type="text"
        class="search-input"
        [value]="searchTerm()"
        [placeholder]="searchPlaceholder()"
        aria-label="Filter options"
        (input)="onSearchInput($event)"
        (keydown)="onSearchKeydown($event)"
      />
    </div>

    @if (allowClear() && !searchTerm().trim()) {
      <mat-option value="">{{ clearLabel() }}</mat-option>
    }

    @for (option of filteredOptions(); track option) {
      <mat-option [value]="option">{{ option }}</mat-option>
    } @empty {
      <div class="empty-option">{{ emptyText() }}</div>
    }
  </mat-select>

  @if (errorMessage()) {
    <mat-error>{{ errorMessage() }}</mat-error>
  }
</mat-form-field>
