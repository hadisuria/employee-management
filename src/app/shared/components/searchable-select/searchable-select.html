<div class="select-wrapper">
  <button
    type="button"
    class="select-trigger"
    [id]="inputId()"
    [class.is-open]="isOpen()"
    [class.is-invalid]="invalid()"
    [class.is-placeholder]="!selectedValue()"
    [disabled]="isDisabled()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleOpen()"
  >
    <span class="trigger-text">{{ displayLabel() }}</span>
    <svg
      class="chevron"
      [class.rotated]="isOpen()"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </button>

  @if (isOpen()) {
    <div class="dropdown-panel" role="listbox">
      <div class="search-header">
        <svg
          class="search-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          #searchInput
          type="text"
          class="search-box"
          [value]="searchTerm()"
          [placeholder]="searchPlaceholder()"
          aria-label="Filter options"
          (input)="onSearchInput($event)"
        />
      </div>

      <div class="options-list">
        @if (allowClear() && !searchTerm().trim()) {
          <button
            type="button"
            class="option-item"
            role="option"
            [attr.aria-selected]="selectedValue() === ''"
            [class.is-selected]="selectedValue() === ''"
            (click)="selectOption('')"
          >
            <span>{{ clearLabel() }}</span>
            @if (selectedValue() === '') {
              <svg
                class="check-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
            }
          </button>
        }

        @for (option of filteredOptions(); track option) {
          <button
            type="button"
            class="option-item"
            role="option"
            [attr.aria-selected]="selectedValue() === option"
            [class.is-selected]="selectedValue() === option"
            (click)="selectOption(option)"
          >
            <span>{{ option }}</span>
            @if (selectedValue() === option) {
              <svg
                class="check-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
            }
          </button>
        } @empty {
          <div class="empty-state">{{ emptyText() }}</div>
        }
      </div>
    </div>
  }
</div>
