@if (notificationService.toasts().length > 0) {
  <div class="toast-stack" role="region" aria-label="Notifications" aria-live="polite">
    @for (toast of notificationService.toasts(); track toast.id) {
      <div class="toast" [class]="'toast-' + toast.type" role="status">
        <mat-icon class="toast-icon" aria-hidden="true">
          @switch (toast.type) {
            @case ('warning') {
              warning_amber
            }
            @case ('danger') {
              error_outline
            }
            @case ('success') {
              check_circle_outline
            }
          }
        </mat-icon>

        <span class="toast-message">{{ toast.message }}</span>

        <button
          matIconButton
          type="button"
          class="toast-close"
          aria-label="Dismiss notification"
          (click)="notificationService.dismiss(toast.id)"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
  </div>
}
